<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WealthClicker</title>
</head>
<body>
    <header>
        <h1 id="title">WealthClicker</h1>
    </header>
    <main>
        <middle id="middle">
            <article>
                <h2 id="wealthTitle">Your wealth:</h2>
                <p id="counter">0</p>
                <button id="dollar"><strong>$</strong></button>
            </article>

            <article>
                <h2 id="wealthTitle">Upgrades</h2>
                <button class="upgrades" id="upg1">Upgrade 1</button>
                <button class="upgrades" id="upg2">Upgrade 2</button>
                <button class="upgrades" id="upg3">Upgrade 3</button>
                <button class="upgrades" id="upg4">Upgrade 4</button>
            </article>
        </middle>
    </main>
    
    <script src="javascript.js"></script>
</body>
</html>
