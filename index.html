<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>WealthClicker</title>
</head>
<body>
    <header>
        <h1 id="title">WealthClicker</h1>
    </header>
    <main>
        <middle id="middle">
            <article id="upgradeArticle">
                <h2 id="wealthTitle">Your Job</h2>
                <div id="upgradeContainer">
                    <div class="upgradeCard">
                            <img src="img/begger.jpg" id="jobImg">
                            <p class="upgradeTitle">Current Job:</p>
                            <p class="upgradeEffect" id="currentJob">Begger</p>
                            <button id="currentClickNum">1$/Click</button>
                        </div>
                    <div class="upgradeCard">
                        <img src="img/fastFoodWorker.jpg" id="jobUpgradeImg">
                        <p id="jobTitle">Fast Food</p>
                        <p id="jobEarnings">2$/Click</p>
                        <button class="upgrades" id="job">New Job | Cost: 20$</button>
                    </div>
                </div>
            </article>

            <article>
                <h2 id="wealthTitle">Your wealth:</h2>
                <p id="counter">0$</p>
                <button id="dollar"><strong>$</strong></button>
            </article>

            <article id="upgradeArticle">
                <h2 id="wealthTitle">Businesses</h2>
                <div id="upgradeContainer">
                    <div class="upgradeCard">
                        <img src="img/lemonadeStand.jpg">
                        <p class="upgradeTitle">Lemonade Stand</p>
                        <p class="upgradeEffect">5$/s</p>
                        <button class="upgrades" id="upg1">Buy | Cost: 50$</button>
                    </div>
                    <div class="upgradeCard">
                        <img src="img/hotDogCart.jpg">
                        <p class="upgradeTitle">Hot Dog Cart</p>
                        <p class="upgradeEffect">25$/s</p>
                        <button class="upgrades" id="upg2">Buy | Cost: 250$</button>
                    </div>
                    <div class="upgradeCard">
                        <img src="img/vendingMachine.jpg">
                        <p class="upgradeTitle">Vending Machine</p>
                        <p class="upgradeEffect">50$/s</p>
                        <button class="upgrades" id="upg3">Buy | Cost: 1K$</button>
                    </div>
                    <div class="upgradeCard">
                        <img src="img/arcade.jpg">
                        <p class="upgradeTitle">Arcade</p>
                        <p class="upgradeEffect">100$/s</p>
                        <button class="upgrades" id="upg4">Buy | Cost: 10K$</button>
                    </div>
                    <div class="upgradeCard">
                        <img src="img/cornerStore.jpg">
                        <p class="upgradeTitle">Corner Store</p>
                        <p class="upgradeEffect">500$/s</p>
                        <button class="upgrades" id="upg5">Buy | Cost: 50K$</button>
                    </div>
                    <div class="upgradeCard">
                        <img src="img/nightClub.jpg">
                        <p class="upgradeTitle">Night Club</p>
                        <p class="upgradeEffect">2,5K$/s</p>
                        <button class="upgrades" id="upg6">Buy | Cost: 250K$</button>
                    </div>
                </div>
            </article>
        </middle>
    </main>
    
    <script src="javascript.js"></script>
</body>
</html>
